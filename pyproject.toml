[project]
name = "carburants"
version = "0.1.0"
description = "Collecte et analyse des prix des carburants et des bornes de recharge en France"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analyse = ["matplotlib>=3.8", "scikit-learn>=1.4", "jupyterlab>=4"]

[project.scripts]
carburants = "carburants.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
