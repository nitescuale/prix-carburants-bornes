name: Collecte quotidienne

# Chaque matin : photo des prix de toutes les stations, cours du Brent et du dollar ; chaque lundi : bornes IRVE,
# enseignes des stations (OpenStreetMap), bulletin pétrolier européen et données territoriales (communes, voitures
# par type de recharge, prix de l'électricité).
# Elle tourne aussi quand le code de collecte change sur main, pour valider le changement sur les vraies données
# (sans écraser la photo des prix déjà prise ce jour-là).
# Les fichiers Parquet sont ajoutés à la branche `data`, séparée du code.
on:
  push:
    branches: [main]
    paths:
      - "src/carburants/**"
      - ".github/workflows/collecte.yml"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      hebdo:
        description: "Collecter aussi les bornes IRVE et les enseignes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .

      - name: Préparer la branche data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data; then
            git fetch --depth 1 origin data
            git worktree add -B data donnees origin/data
          else
            git worktree add --orphan -b data donnees
          fi

      - name: Prix instantanés
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -d "donnees/prix/instantane/date=$(date -u +%F)" ]; then
            echo "La photo du jour existe déjà : on ne l'écrase pas."
          else
            carburants --dossier donnees instantane
          fi

      # Sources externes gratuites : un échec n'empêche pas de publier le reste, mais il est signalé plus bas
      - name: Cours du Brent et taux euro/dollar (FRED)
        id: marches
        continue-on-error: true
        run: carburants --dossier donnees marches

      - name: Collectes hebdomadaires (le lundi, à la demande, ou quand le code change)
        id: hebdo
        run: |
          if [ "${{ inputs.hebdo }}" = "true" ] || [ "${{ github.event_name }}" = "push" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "lancer=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bornes IRVE
        if: steps.hebdo.outputs.lancer == 'true'
        run: carburants --dossier donnees irve

      # Overpass (OpenStreetMap) est un service gratuit parfois saturé : un échec ici ne doit pas
      # empêcher de publier les prix et les bornes du jour.
      - name: Enseignes des stations (OpenStreetMap)
        id: enseignes
        if: steps.hebdo.outputs.lancer == 'true'
        continue-on-error: true
        run: carburants --dossier donnees enseignes

      - name: Bulletin pétrolier européen (prix avec et sans taxes)
        id: bulletin
        if: steps.hebdo.outputs.lancer == 'true'
        continue-on-error: true
        run: carburants --dossier donnees bulletin

      - name: Communes, voitures par type de recharge, prix de l'électricité
        id: territoires
        if: steps.hebdo.outputs.lancer == 'true'
        continue-on-error: true
        run: carburants --dossier donnees territoires

      - name: Signaler les sources en échec
        if: steps.enseignes.outcome == 'failure' || steps.marches.outcome == 'failure' || steps.bulletin.outcome == 'failure' || steps.territoires.outcome == 'failure'
        env:
          ENSEIGNES: ${{ steps.enseignes.outcome }}
          MARCHES: ${{ steps.marches.outcome }}
          BULLETIN: ${{ steps.bulletin.outcome }}
          TERRITOIRES: ${{ steps.territoires.outcome }}
        run: |
          for source in "Enseignes OpenStreetMap:$ENSEIGNES" "Brent et euro/dollar (FRED):$MARCHES" "Bulletin pétrolier européen:$BULLETIN" "Données territoriales:$TERRITOIRES"; do
            if [ "${source##*:}" = "failure" ]; then
              echo "::warning title=Collecte::${source%%:*} non mis à jour ; le reste est publié quand même."
              echo "⚠️ ${source%%:*} non mis à jour. Voir le journal de l'étape." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # Les données sont publiées même si un contrôle échoue (le rapport est publié avec elles) ; la tâche échoue ensuite
      - name: Contrôler les données du jour
        id: controle
        continue-on-error: true
        run: carburants --dossier donnees controler

      - name: Publier sur la branche data
        working-directory: donnees
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
            exit 0
          fi
          git commit -m "Collecte du $(date -u +%F)"
          # Le suivi hebdomadaire publie aussi sur la branche data : en cas de course, on reprend ses commits
          for essai in 1 2 3; do
            git push origin data && exit 0
            git pull --rebase origin data
          done
          exit 1

      - name: Échouer si un contrôle est en erreur
        if: steps.controle.outcome == 'failure'
        run: |
          echo "::error title=Contrôles::Au moins un contrôle des données est en erreur : voir le résumé de la tâche."
          exit 1
