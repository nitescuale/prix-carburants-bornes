name: Suivi hebdomadaire

# Après chaque rechargement de l'historique (le dimanche) : la série hebdomadaire du prix médian du gazole, la
# prévision de la semaine suivante et le journal des prévisions passées, publiés sur la branche data (dossier suivi/).
# Au premier lancement, ou à la demande, toute la série est recalculée depuis 2007.
on:
  workflow_run:
    workflows: ["Historique des prix"]
    types: [completed]
  workflow_dispatch:
    inputs:
      complet:
        description: "Recalculer toute la série et repartir d'un journal vide"
        type: boolean
        default: false

permissions:
  contents: write

# Même groupe que la collecte : les deux tâches publient sur la branche data, l'une après l'autre
concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  suivi:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . "pandas>=2"

      - name: Préparer la branche data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin data
          git worktree add -B data donnees origin/data

      - name: Télécharger l'historique
        id: historique
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLET: ${{ inputs.complet }}
        run: |
          mkdir historique
          if [ "$COMPLET" = "true" ] || [ ! -f donnees/suivi/serie_gazole.parquet ]; then
            gh release download historique --dir historique --pattern "prix_*.parquet"
            echo "option=--complet" >> "$GITHUB_OUTPUT"
          else
            annee=$(date -u +%Y)
            gh release download historique --dir historique --pattern "prix_$((annee - 1)).parquet" --pattern "prix_${annee}.parquet"
          fi
          ls -la historique

      - name: Série, prévision et bilan
        run: carburants --dossier donnees suivi --historique historique ${{ steps.historique.outputs.option }}

      - name: Publier sur la branche data
        working-directory: donnees
        run: |
          git add suivi
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
            exit 0
          fi
          git commit -m "Suivi de la prévision du $(date -u +%F)"
          for essai in 1 2 3; do
            git push origin data && exit 0
            git pull --rebase origin data
          done
          exit 1
